[package]
name = "calibre-fmt"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
publish.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
name = "calibre_fmt"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "calibre-fmt"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["clap", "tracing-flame", "tracing-appender"]
wasm = ["wasm-bindgen", "getrandom/js"]
python = ["pyo3"]
ffi = ["cbindgen"]

[dependencies]
clap = { workspace = true, optional = true }
calibre-parser = { workspace = true }
calibre-diagnostics = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-flame = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
wasm-bindgen = { version = "0.2", optional = true }
getrandom = { version = "0.2", optional = true }
pyo3 = { version = "0.18", optional = true, features = ["extension-module"] }

[build-dependencies]
cbindgen = {version = "0.28", optional = true}