[package]
name = "calibre-frontend"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
publish.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["native"]
native = ["calibre-parser/native", "calibre-mir/native", "calibre-vm/native", "fs"]
wasm = ["calibre-parser/wasm", "calibre-mir/wasm", "calibre-vm/wasm"]
fs = ["glob"]

[dependencies]
codespan-reporting = { workspace = true }
calibre-parser = { workspace = true }
calibre-mir = { workspace = true }
calibre-vm = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
rustc-hash = { workspace = true }
toml = "1.0.1"
directories = "6.0.0"
glob = {version = "0.3.1", optional = true}
