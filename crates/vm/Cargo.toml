[package]
name = "calibre-vm"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
tracing = { workspace = true }
calibre-lir = { workspace = true }
calibre-parser = { workspace = true }
calibre-bytecode = { workspace = true }
fastrand = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
smallvec = "1"
serde = { workspace = true }
indextree = { workspace = true }
wasm_thread = { workspace = true }
wasm_sync = { workspace = true }
ustr = { workspace = true }
dumpster = "2"
libloading = {version = "0.9", optional = true }
libffi = {version = "5", features = ["system"], optional = true }
regex = "1.10"
sha2 = "0.11"
blake3 = "1.5"
hex = "0.4"
dyn-hash = "1"

ureq = {version = "3", optional = true }
socket2 = {version = "0.6", optional = true }
errno = { version = "0.3", optional = true }
astro-float = "=0.9"

[features]
default = ["native"]
native = ["errno", "libffi", "libloading", "ureq", "socket2", "calibre-parser/native", "calibre-lir/native"]
wasm = ["calibre-parser/wasm", "calibre-lir/wasm"]
