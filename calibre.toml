[package]
# TODO enforce that name is a valid calibre identifier
name = "the_first_project"
description = "The fist ever project "
version = "0.0.1"
authors = ["Creative Coders <officialccoders@gmail.com>"]
calibre = ">= 0.0.1"
readme = "README.md"
homepage = ""
# source path to the projet defaults to src/
src = "./examples/bench/fib/"
repository = "https://github.com/CodersCreative/calibre-lang"
license = "MIT"

# members will be used to reference members who are a part of this package
# [members]
# ... = { path = "path from calibre.toml to other calibre.toml" }

# [dependencies]
# They use greater than and equal signs
# Versioning will only really become useful when/if I create a package manager registry
# ... = ">= 0.0.1 and < 2.0.0"
# Right now we will rely on git
# ... = { git = "git@...", ref = "main/a8b3c5d82" }
# I think I'll also allow local path dependencies
# ... = { path = "path from calibre.toml" }

# [dev-dependencies]
# Same syntax as dependencies


# [features]
# Similar syntax to rust
# ... = []

[examples]
# It will automatically add the files found as examples using appropriate names
members = ["./examples/*", "fib"]

# To specify an example
# It will always prioritize most specific first so the other examples tag wont contain this file
[[example]]
name = "pi"
path = "./examples/bench/pi/test.cal"

[[example]]
name = "fib"
path = "./examples/bench/fib/test.cal"
