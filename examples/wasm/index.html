<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="color-scheme" content="light dark">
	<style>
		body {
			font-family: system-ui, sans-serif;
			max-width: 760px;
			margin: 1em auto;
			padding: 0 1em;
		}

		h1 {
			margin-bottom: .25em;
		}

		label {
			font-weight: 600;
		}

		textarea {
			width: 100%;
			box-sizing: border-box;
			font-family: monospace;
			font-size: 14px;
			tab-size: 2;
		}

		#code {
			min-height: 6em;
		}

		#output {
			min-height: 8em;
			background: #ffffff0f;
		}

		button {
			font-size: 14px;
			padding: .4em 1.2em;
			cursor: pointer;
		}
	</style>
</head>

<body>
	<h1>calibre wasm</h1>
	<p>try by compiling the wasm binaries, running `npx mini-coi` in the project's root directory and going to
		`http://localhost:8000/examples/wasm/`</p>

	<textarea id="code" style="margin-bottom:.75em">
		const main := fn => print("Hello!");
	</textarea>
	<button id="run">eval</button>
    <button id="fmt">format</button><br />

	<label for="output" style="display:block;margin-top:1em">program result:</label>
	<textarea id="output" readonly style="display:inline-block;background:#ffffff0f"></textarea>

	<label for="io-output" style="display:block;margin-top:1em">io output:</label>
	<textarea id="io-output" readonly style="min-height:6em;background:#ffffff0f" /></textarea>

	<script type="module">
		import init, {format} from './pkg/fmt/calibre_fmt.js'
        import initSync, {run} from './pkg/calibre/calibre.js'

		const outputBox = document.getElementById('output')
		const ioBox = document.getElementById('io-output')
		const codeInput = document.getElementById('code')

        async function initWasm() {
            try {
                await init();
                await initSync();
                
                outputBox.value = 'Wasm initialized successfully!';
            } catch (error) {
                outputBox.value = 'Failed to initialize wasm: ' + error;
            }
        }
        
		initWasm();


		function evalCode() {
			ioBox.value = ''
            try {
			let result = run(codeInput.value)
            console.log(result);
            outputBox.value = result.captured_output()
            } catch (e) {
                console.log(e);
            }
		}

		document.getElementById('run').addEventListener('click', evalCode)

    	function fmtCode() {
			ioBox.value = ''
			outputBox.value = format(codeInput.value)
		}

        document.getElementById('fmt').addEventListener('click', fmtCode)

        
		fmtCode()
	</script>
</body>

</html>
